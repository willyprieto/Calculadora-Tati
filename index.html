<title>Costos & Rentabilidad — Tati</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: #2b2b28; background: #F2EBE0; }

  .verde { background: #5a8a3c; } .amarillo { background: #d6a32e; } .rojo { background: #c14a3a; }

  input.cell.sm { width: 54px; }

  .addbtn { background: #3E4A3D; color: #F2EBE0; border: none; border-radius: 8px; padding: 11px 14px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 12px; }

    { id: "desg-a", grupo: "Desgaste (= reflejos con papel)", nombre: "Desgaste · Alto", precio: 240000, min: 180, receta: [["polvo", 50], ["ox30", 120], ["papel", 1]] },
    { id: "contorno-solo", grupo: "Contorno iluminado", nombre: "Contorno solo", precio: 100000, min: 30, receta: [["polvo", 10], ["ox30", 20], ["papel", 1]] },
    { id: "contorno-combo", grupo: "Contorno iluminado", nombre: "Contorno + otro proc.", precio: 60000, min: 30, receta: [["polvo", 10], ["ox30", 20], ["papel", 1]] },
    { id: "pei-brush-b", grupo: "Peinado brushing / planchita", nombre: "Brushing/planchita · Bajo", precio: 80000, min: 40, receta: [["protector", 2], ["spray", 5]] },
    { id: "pei-brush-a", grupo: "Peinado brushing / planchita", nombre: "Brushing/planchita · Alto", precio: 120000, min: 40, receta: [["protector", 2], ["spray", 5]] },
    { id: "pei-semi-b", grupo: "Peinado semi recogido", nombre: "Semi recogido · Bajo", precio: 120000, min: 60, receta: [["protector", 2], ["spray", 5], ["horquillas", 25]] },
    { id: "pei-semi-a", grupo: "Peinado semi recogido", nombre: "Semi recogido · Alto", precio: 130000, min: 60, receta: [["protector", 2], ["spray", 5], ["horquillas", 25]] },
    { id: "pei-reco", grupo: "Peinado recogido", nombre: "Recogido · Bajo", precio: 160000, min: 60, receta: [["protector", 2], ["spray", 5], ["horquillas", 50]] },
  ],
  fijos: [
    { nombre: "Seguro auto", monto: 200000 },
    { nombre: "Depreciación auto (Peugeot 207)", monto: 50000 },
    { nombre: "Publicidad / ads Instagram", monto: 50000 },
    { nombre: "Patente", monto: 30000 },
    { nombre: "Celular + internet", monto: 30000 },
    { nombre: "Canva + herramientas", monto: 10000 },
    { nombre: "Monotributo (consultar contador)", monto: 0 },
  ],
  clientas: [],
  turnos: [],
  gastos: [],
  params: {
    naftaLitro: 2000, consumo: 10, desgasteKm: 60, kmViaje: 20, peaje: 0,
    ingresoObjetivo: 2250000, horasMes: 150, tiempoViajeMin: 40, margen: 30, turnosEstim: 30,
  },
};

const CATEGORIAS = ["Insumos", "Auto (nafta, cubiertas, service)", "Equipo / Activo", "Otros"];

// ================= Estado + guardado =================
const KEY = "tati_costos_v1";
let state, tab = "servicios";
const ui = { cliQuery: "", histNom: "", histDesde: "", histHasta: "", gDesde: "", gHasta: "", resDesde: "", resHasta: "" };
let draft = emptyDraft();
let gdraft = emptyGasto();

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function hoyStr() { return iso(new Date()); }

function emptyDraft() { return { clientaId: null, nuevaCliente: null, fecha: hoyStr(), entrada: "", salida: "", servicios: [], editId: null }; }
function emptyRow() { return { procId: "", precioLista: 0, descTipo: "none", descValor: 0, precioFinal: 0, manual: false, obs: "" }; }
function emptyGasto() { return { productoId: "", nuevo: false, nombre: "", unidad: "u", categoria: "Insumos", fecha: hoyStr(), envases: 1, precioEnvase: 0 }; }

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return clone(DEFAULTS);
    const s = JSON.parse(raw);
    return {
      productos: mergeProductos(s.productos),
      procs: mergeProcs(s.procs),
      fijos: s.fijos || clone(DEFAULTS.fijos),
      clientas: s.clientas || [],
      turnos: (s.turnos || []).map(migrarTurno),
      gastos: s.gastos || [],
      params: Object.assign(clone(DEFAULTS.params), s.params || {}),
    };
  } catch (e) { return clone(DEFAULTS); }
}
// Trae los servicios/productos nuevos del código, conservando los precios que la usuaria ya editó.
function mergeProcs(saved) {
  const byId = {}; (saved || []).forEach(p => byId[p.id] = p);
  const merged = DEFAULTS.procs.map(d => { const s = byId[d.id]; return s ? Object.assign({}, d, { precio: s.precio != null ? s.precio : d.precio }) : clone(d); });
  (saved || []).forEach(p => { if (!DEFAULTS.procs.find(d => d.id === p.id)) merged.push(p); });
  return merged;
}
function mergeProductos(saved) {
  const byId = {}; (saved || []).forEach(p => byId[p.id] = p);
  const merged = DEFAULTS.productos.map(d => { const s = byId[d.id]; return s ? Object.assign({}, d, { precioEnvase: s.precioEnvase != null ? s.precioEnvase : d.precioEnvase, contenido: s.contenido != null ? s.contenido : d.contenido }) : clone(d); });
  (saved || []).forEach(p => { if (!DEFAULTS.productos.find(d => d.id === p.id)) merged.push(p); });
  return merged;
}
function migrarTurno(t) {
  if (t.servicios) return t;
  const proc = DEFAULTS.procs.find(p => p.id === t.procId);
  const precio = proc ? proc.precio : 0;
  return { id: t.id || ("t_" + Math.random()), fecha: t.fecha, clientaId: t.clientaId, entrada: t.entrada, salida: t.salida,
    servicios: t.procId ? [{ procId: t.procId, precioLista: precio, descTipo: "none", descValor: 0, precioFinal: precio, obs: t.obs || "" }] : [] };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

// ================= Utilidades =================
const fmt = (n) => "$" + Math.round(n || 0).toLocaleString("es-AR");
const pct = (n) => Math.round(n * 100) + "%";
const num = (v) => { const x = parseFloat(v); return isNaN(x) ? 0 : x; };
const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const nombreCli = (id) => { const c = state.clientas.find(x => x.id === id); return c ? c.nombre + " " + c.apellido : "?"; };
const nombreProc = (id) => { const p = state.procs.find(x => x.id === id); return p ? p.nombre : "?"; };
function horas(t) { return t.entrada && t.salida ? ((new Date("1970-01-01T" + t.salida) - new Date("1970-01-01T" + t.entrada)) / 3600000) : 0; }
function inRange(f, d, h) { return (!d || f >= d) && (!h || f <= h); }
function mesesEnRango(d, h) { if (!d || !h) return 1; const a = new Date(d), b = new Date(h); return Math.max(1, (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) + 1); }

// ================= Cálculo de precios (teórico, para decidir cuánto cobrar) =================
function compute() {
  const p = state.params;
  const costoUnit = {};
  state.productos.forEach((x) => costoUnit[x.id] = x.contenido > 0 ? x.precioEnvase / x.contenido : 0);
  const tarifaHora = p.horasMes > 0 ? p.ingresoObjetivo / p.horasMes : 0;
  const naftaKm = (p.naftaLitro * p.consumo) / 100;
  const costoViaje = p.kmViaje * (naftaKm + p.desgasteKm) + p.peaje;
  const fijosMes = state.fijos.reduce((s, f) => s + num(f.monto), 0);
  const fijoPorTurno = p.turnosEstim > 0 ? fijosMes / p.turnosEstim : 0;
  const filas = state.procs.map((pr) => {
    const insumos = pr.receta.reduce((s, r) => s + (costoUnit[r[0]] || 0) * r[1], 0);
    const tiempoCosto = ((pr.min + p.tiempoViajeMin) / 60) * tarifaHora;
    const costoTotal = insumos + costoViaje + tiempoCosto + fijoPorTurno;
    const objetivo = costoTotal * (1 + p.margen / 100);
    const margenActual = pr.precio > 0 ? (pr.precio - costoTotal) / pr.precio : -1;
    let estado = "rojo";
    if (pr.precio >= objetivo) estado = "verde"; else if (pr.precio >= costoTotal) estado = "amarillo";
    return Object.assign({}, pr, { insumos, tiempoCosto, costoTotal, piso: costoTotal, objetivo, margenActual, estado });
  });
  return { costoUnit, tarifaHora, naftaKm, costoViaje, fijosMes, fijoPorTurno, filas };
}

// ================= Render =================
function render() {
  const c = compute();
  const tabs = [["servicios", "Servicios"], ["gastos", "Gastos"], ["resultados", "Resultados"], ["precios", "Precios"], ["insumos", "Insumos"], ["param", "Ajustes"]];
  let h = '<div class="head"><h1>Costos & Rentabilidad — Tati</h1><p>Peluquería a domicilio</p></div>';
  h += '<div class="nav">' + tabs.map(t => '<button data-action="tab" data-tab="' + t[0] + '" class="' + (tab === t[0] ? "on" : "") + '">' + t[1] + '</button>').join("") + '</div>';
  h += '<div class="body">';
  if (tab === "servicios") h += viewServicios(c);
  else if (tab === "gastos") h += viewGastos(c);
  else if (tab === "resultados") h += viewResultados(c);
  else if (tab === "precios") h += viewPrecios(c);
  else if (tab === "insumos") h += viewInsumos(c);
  else if (tab === "param") h += viewParam(c);
  h += foot();
  h += '</div>';
  document.getElementById("app").innerHTML = h;
}

// ---------- SERVICIOS ----------
function viewServicios(c) {
  let h = '<div class="note"><b>Cargá cada turno que hiciste.</b> Elegí la clienta, sumá los servicios que le hiciste (podés poner varios), aplicá descuento si corresponde y guardá. Esto arma tu facturación real.</div>';

  // Clienta
  h += '<h2 class="sec">Clienta</h2>';
  if (draft.clientaId) {
    h += '<div class="selbox"><span><b>' + esc(nombreCli(draft.clientaId)) + '</b></span><button class="linkbtn" data-action="cambiar-cli">cambiar</button></div>';

      h += '</optgroup></select>';
      if (r.procId) {

          + '<option value="%"' + (r.descTipo === "%" ? " selected" : "") + '>En %</option></select></div>';

    turnos.forEach(t => {
      const tot = t.servicios.reduce((s, r) => s + r.precioFinal, 0);

      t.servicios.forEach(r => {

      });
      h += '</div>';
    });
  }
  return h;
}

  m.slice(0, 8).forEach(c => h += '<button class="cli-item" data-action="sel-cli" data-id="' + c.id + '">' + esc(c.nombre + " " + c.apellido) + (c.tel ? ' · ' + esc(c.tel) : '') + '</button>');

// ---------- RESULTADOS ----------
function viewResultados(c) {
  const turnosR = state.turnos.filter(t => inRange(t.fecha, ui.resDesde, ui.resHasta));
  let ingresos = 0, lista = 0, descuento = 0, nServ = 0;
  turnosR.forEach(t => t.servicios.forEach(s => { ingresos += s.precioFinal; lista += s.precioLista; descuento += (s.precioLista - s.precioFinal); nServ++; }));
  const gastosR = state.gastos.filter(g => inRange(g.fecha, ui.resDesde, ui.resHasta));
  const porCat = {}; gastosR.forEach(g => porCat[g.categoria] = (porCat[g.categoria] || 0) + g.monto);
  const gastosTotal = gastosR.reduce((s, g) => s + g.monto, 0);
  const meses = mesesEnRango(ui.resDesde, ui.resHasta);
  const fijosPeriodo = c.fijosMes * meses;
  const resultado = ingresos - gastosTotal - fijosPeriodo;
  const metaPeriodo = state.params.ingresoObjetivo * meses;

  let h = '<div class="note"><b>Estado de resultados real.</b> Elegí el período. Toma los servicios cargados (ingresos) menos los gastos cargados y los costos fijos de esos meses. Es la plata que realmente te queda.</div>';
  h += '<div class="rango"><div>' + lab("Desde") + '<input class="fld" type="date" data-kind="ui" data-field="resDesde" value="' + ui.resDesde + '"></div>';
  h += '<div>' + lab("Hasta") + '<input class="fld" type="date" data-kind="ui" data-field="resHasta" value="' + ui.resHasta + '"></div></div>';

  h += '<div class="cards">';
  h += card("Ingresos (" + nServ + " servicios)", fmt(ingresos), turnosR.length + " turnos · " + meses + (meses > 1 ? " meses" : " mes"), "");
  h += card("Gastos + fijos", fmt(gastosTotal + fijosPeriodo), fmt(gastosTotal) + " gastos + " + fmt(fijosPeriodo) + " fijos", "");
  h += card("Resultado del período", fmt(resultado), resultado >= 0 ? "es lo que te queda a vos" : "estás en rojo", resultado >= 0 ? "good" : "alert");
  h += card("Descuentos que hiciste", fmt(descuento), lista > 0 ? pct(descuento / lista) + " sobre precio de lista" : "—", "");
  h += '</div>';

  // Barra
  const seg = [["Gastos", gastosTotal, "#B89B5E"], ["Costos fijos", fijosPeriodo, "#a9744f"], ["Te queda", Math.max(resultado, 0), "#3E4A3D"]];
  const tot = seg.reduce((s, x) => s + x[1], 0) || 1;
  h += '<h2 class="sec">A dónde fue cada peso</h2><div class="bar">';
  seg.filter(s => s[1] > 0).forEach(s => h += '<span style="width:' + (s[1] / tot * 100) + '%;background:' + s[2] + '">' + (s[1] / tot > 0.12 ? s[0] : "") + '</span>');
  h += '</div><div>' + seg.map(s => '<span class="pill">' + s[0] + ': ' + fmt(s[1]) + '</span>').join("") + '</div>';

  // Gastos por categoría
  h += '<h2 class="sec">Gastos por categoría</h2><div class="panel"><table><tbody>';
  const cats = Object.keys(porCat);
  if (cats.length === 0) h += '<tr><td style="color:#9a9483">Sin gastos en el período</td><td></td></tr>';
  else cats.forEach(k => h += '<tr><td>' + esc(k) + '</td><td>' + fmt(porCat[k]) + '</td></tr>');
  h += '<tr><td><b>Costos fijos (' + meses + (meses > 1 ? ' meses' : ' mes') + ')</b></td><td><b>' + fmt(fijosPeriodo) + '</b></td></tr>';
  h += '</tbody></table></div>';

  h += '<h2 class="sec">Contra tu meta</h2>';
  h += '<div class="note ' + (resultado >= metaPeriodo ? "green" : "") + '">Tu meta es ' + fmt(state.params.ingresoObjetivo) + '/mes → ' + fmt(metaPeriodo) + ' en este período de ' + meses + (meses > 1 ? ' meses' : ' mes') + '. Te queda ' + fmt(resultado) + ' (' + (metaPeriodo > 0 ? pct(resultado / metaPeriodo) : "—") + ' de la meta).</div>';
  return h;
}

function card(lbl, val, sub, cls) {
  return '<div class="card ' + (cls || "") + '"><div class="lbl">' + lbl + '</div><div class="val">' + val + '</div><div class="sub">' + sub + '</div></div>';
}

function descargarRespaldo() {
  try {
    const blob = new Blob([JSON.stringify(state)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "respaldo-tati-" + hoyStr() + ".json";
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
  } catch (e) { alert("No se pudo generar el respaldo en este navegador."); }
}
function importarRespaldo(file) {
  const reader = new FileReader();
  reader.onload = function (e) {
    let s;
    try { s = JSON.parse(e.target.result); } catch (err) { alert("No se pudo leer el archivo (no es un respaldo válido)."); return; }
    if (!s || !s.procs || !s.productos) { alert("El archivo no parece un respaldo de esta app."); return; }
    if (!confirm("Esto reemplaza TODOS los datos actuales por los del respaldo. ¿Seguir?")) return;
    state = {
      productos: mergeProductos(s.productos),
      procs: mergeProcs(s.procs),
      fijos: s.fijos || clone(DEFAULTS.fijos),
      clientas: s.clientas || [],
      turnos: (s.turnos || []).map(migrarTurno),
      gastos: s.gastos || [],
      params: Object.assign(clone(DEFAULTS.params), s.params || {}),
    };
    save(); draft = emptyDraft(); gdraft = emptyGasto(); tab = "servicios"; render();
    alert("Respaldo importado ✓");
  };
  reader.readAsText(file);
}

function lab(t) { return '<label class="lab">' + t + '</label>'; }
function pf(label, field, val) { return '<label>' + label + '</label><input inputmode="numeric" data-kind="param" data-field="' + field + '" value="' + val + '">'; }
function foot() { return '<div class="foot">Tus datos se guardan solos en este teléfono.<br><button data-action="reset">Restablecer todo a valores iniciales</button></div>'; }

// ================= Eventos =================
document.addEventListener("input", function (ev) {
  if (ev.target.id === "cli-search") {
    ui.cliQuery = ev.target.value;
    const box = document.getElementById("cli-results");
    if (box) box.innerHTML = cliResultsHtml(ev.target.value);
  }
  if (["g-envases", "g-precio"].indexOf(ev.target.id) >= 0) {
    const env = num((document.getElementById("g-envases") || {}).value);
    const pre = num((document.getElementById("g-precio") || {}).value);
    const hint = document.getElementById("g-total-hint");
    if (hint) hint.innerHTML = "Total del gasto: <b>" + fmt(env * pre) + "</b>";
  }
});

document.addEventListener("change", function (ev) {
  const el = ev.target;
  if (el.id === "import-file" && el.files && el.files[0]) { importarRespaldo(el.files[0]); el.value = ""; return; }
  const kind = el.getAttribute && el.getAttribute("data-kind");
  if (!kind) return;
  if (kind === "df") { draft[el.getAttribute("data-field")] = el.value; return; } // fecha del turno: guarda sin re-render
  const field = el.getAttribute("data-field");
  const idx = el.getAttribute("data-idx");
  const id = el.getAttribute("data-id");
  if (kind === "param") { state.params[field] = num(el.value); save(); render(); }
  else if (kind === "producto") { const o = state.productos.find(x => x.id === id); if (o) o[field] = num(el.value); save(); render(); }
  else if (kind === "proc") { const o = state.procs.find(x => x.id === id); if (o) o[field] = num(el.value); save(); render(); }
  else if (kind === "fijo") { state.fijos[+idx][field] = (field === "nombre") ? el.value : num(el.value); save(); render(); }
  else if (kind === "ui") { ui[field] = el.value; render(); }
  else if (kind === "srv") { srvChange(+idx, field, el.value); }
  else if (kind === "gd") {
    if (field === "productoId") {
      gdraft.productoId = el.value; gdraft.nuevo = (el.value === "__new__");
      const prod = state.productos.find(x => x.id === el.value);
      if (prod) gdraft.precioEnvase = prod.precioEnvase;
    } else { gdraft[field] = el.value; }
    render();
  }
});

function srvChange(i, field, value) {
  const row = draft.servicios[i]; if (!row) return;
  if (field === "proc") { row.procId = value; const p = state.procs.find(x => x.id === value); row.precioLista = p ? p.precio : 0; row.manual = false; }
  else if (field === "desctipo") { row.descTipo = value; row.manual = false; }
  else if (field === "descval") { row.descValor = num(value); row.manual = false; }
  else if (field === "final") { row.precioFinal = num(value); row.manual = true; }
  recomputeRow(row);
  render();
}
function recomputeRow(row) {
  if (row.manual) return;
  let f = row.precioLista;
  if (row.descTipo === "$") f = row.precioLista - row.descValor;
  else if (row.descTipo === "%") f = row.precioLista * (1 - row.descValor / 100);
  row.precioFinal = Math.max(0, Math.round(f));
}

document.addEventListener("click", function (ev) {
  const b = ev.target.closest("[data-action]");
  if (!b) return;
  const a = b.getAttribute("data-action");
  const id = b.getAttribute("data-id");
  const idx = b.getAttribute("data-idx");

  if (a === "tab") { tab = b.getAttribute("data-tab"); render(); window.scrollTo(0, 0); }
  else if (a === "sel-cli") { draft.clientaId = id; ui.cliQuery = ""; draft.nuevaCliente = null; if (draft.servicios.length === 0) draft.servicios.push(emptyRow()); render(); }
  else if (a === "nueva-cli") { const parts = ui.cliQuery.trim().split(" "); draft.nuevaCliente = { nombre: parts[0] || "", apellido: parts.slice(1).join(" ") || "" }; render(); }
  else if (a === "cambiar-cli") { draft.clientaId = null; ui.cliQuery = ""; render(); }
  else if (a === "cancelar-cli") { draft.nuevaCliente = null; render(); }
  else if (a === "guardar-cli") { guardarClienta(); }
  else if (a === "add-srv") { draft.servicios.push(emptyRow()); render(); }
  else if (a === "del-srv") { draft.servicios.splice(+idx, 1); render(); }
  else if (a === "guardar-turno") { guardarTurno(); }
  else if (a === "reset-turno") { draft = emptyDraft(); render(); }
  else if (a === "editar-turno") { editarTurno(id); }
  else if (a === "del-turno") { if (confirm("¿Borrar este turno?")) { state.turnos = state.turnos.filter(t => t.id !== id); save(); render(); } }
  else if (a === "descargar-respaldo") { descargarRespaldo(); }
  else if (a === "importar-respaldo") { const f = document.getElementById("import-file"); if (f) f.click(); }
  else if (a === "guardar-gasto") { guardarGasto(); }
  else if (a === "del-gasto") { if (confirm("¿Borrar este gasto?")) { state.gastos = state.gastos.filter(g => g.id !== id); save(); render(); } }
  else if (a === "add-fijo") { state.fijos.push({ nombre: "Nuevo costo", monto: 0 }); save(); render(); }
  else if (a === "del-fijo") { state.fijos.splice(+idx, 1); save(); render(); }
  else if (a === "reset") { if (confirm("¿Borrar TODOS tus datos (clientas, turnos, gastos) y volver a los valores iniciales?")) { state = clone(DEFAULTS); draft = emptyDraft(); gdraft = emptyGasto(); save(); tab = "servicios"; render(); } }
});

function guardarClienta() {
  const nombre = (document.getElementById("nc-nombre") || {}).value || "";
  const apellido = (document.getElementById("nc-apellido") || {}).value || "";
  if (!nombre.trim()) { alert("Poné al menos el nombre"); return; }
  const cid = "c_" + Date.now();
  state.clientas.push({
    id: cid, nombre: nombre.trim(), apellido: (apellido || "").trim(),
    tel: (document.getElementById("nc-tel") || {}).value || "",
    ig: (document.getElementById("nc-ig") || {}).value || "",
    mail: (document.getElementById("nc-mail") || {}).value || "",
    dir: (document.getElementById("nc-dir") || {}).value || "",
    com: (document.getElementById("nc-com") || {}).value || "",
  });
  save();
  draft.clientaId = cid; draft.nuevaCliente = null; ui.cliQuery = "";
  if (draft.servicios.length === 0) draft.servicios.push(emptyRow());
  render();
}

function editarTurno(id) {
  const t = state.turnos.find(x => x.id === id); if (!t) return;
  draft = {
    clientaId: t.clientaId, nuevaCliente: null, fecha: t.fecha, entrada: t.entrada || "", salida: t.salida || "",
    servicios: t.servicios.map(r => ({ procId: r.procId, precioLista: r.precioLista, descTipo: r.descTipo, descValor: r.descValor, precioFinal: r.precioFinal, manual: true, obs: r.obs || "" })),
    editId: t.id,
  };
  render(); window.scrollTo(0, 0);
}

function guardarTurno() {
  // la fecha ya se guarda en draft al cambiarla (data-kind df); igual leo el DOM por las dudas
  const dom = (document.getElementById("t-fecha") || {}).value;
  if (dom) draft.fecha = dom;
  if (!draft.clientaId) { alert("Elegí una clienta"); return; }
  const servicios = draft.servicios.filter(r => r.procId);
  if (servicios.length === 0) { alert("Agregá al menos un servicio"); return; }
  if (!draft.fecha) { alert("Poné la fecha"); return; }
  const registro = {
    id: draft.editId || ("t_" + Date.now()), fecha: draft.fecha, clientaId: draft.clientaId,
    entrada: draft.entrada || "", salida: draft.salida || "",
    servicios: servicios.map(r => ({ procId: r.procId, precioLista: r.precioLista, descTipo: r.descTipo, descValor: r.descValor, precioFinal: r.precioFinal, obs: r.obs || "" })),
  };
  if (draft.editId) {
    const i = state.turnos.findIndex(t => t.id === draft.editId);
    if (i >= 0) state.turnos[i] = registro; else state.turnos.push(registro);
  } else {
    state.turnos.push(registro);
  }
  save();
  const editaba = !!draft.editId;
  draft = emptyDraft();
  alert(editaba ? "Cambios guardados ✓" : "Turno guardado ✓");
  render(); window.scrollTo(0, 0);
}

function guardarGasto() {
  const fecha = (document.getElementById("g-fecha") || {}).value || hoyStr();
  const envases = num((document.getElementById("g-envases") || {}).value) || 1;
  const precio = num((document.getElementById("g-precio") || {}).value);
  let nombre = "", productoId = "";
  if (gdraft.nuevo) {
    nombre = (document.getElementById("g-nombre") || {}).value || "";
    if (!nombre.trim()) { alert("Poné el nombre del producto"); return; }
  } else if (gdraft.productoId) {
    const prod = state.productos.find(x => x.id === gdraft.productoId);
    if (!prod) { alert("Elegí un producto"); return; }
    nombre = prod.nombre; productoId = prod.id;
    // actualizar precio del insumo en la calculadora
    prod.precioEnvase = precio;
  } else { alert("Elegí un producto"); return; }
  if (!precio) { alert("Poné el precio"); return; }

  state.gastos.push({ id: "g_" + Date.now(), fecha, productoId, nombre: nombre.trim(), categoria: gdraft.categoria, envases, precioEnvase: precio, monto: envases * precio });
  save();
  gdraft = emptyGasto();
  alert("Gasto guardado ✓");
  render(); window.scrollTo(0, 0);
}

// ================= Arranque =================
state = load();
ui.resDesde = iso(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
ui.resHasta = iso(new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0));
render();
</script>
